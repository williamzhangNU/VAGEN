# Server configuration
server_url: "http://localhost:5001"
server_timeout: 600
server_max_workers: 48

# Inference parameters
batch_size: 32
max_steps: 20
split: "test"
debug: false
enable_think: true

# Output configuration
output_dir: "results/passive_rot/with_instruction"
override: true
evaluate_cogmap: false

# WandB configuration
use_wandb: false
wandb_project: "vagen-debug"
val_generations_to_log_to_wandb: 10 

# Display settings
show_progress: true