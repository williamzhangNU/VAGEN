_common: &common
  env_type: SpatialGym
  max_actions_per_traj: 1
  env_instruction: "You are solving a spatial question."
  max_tokens: 256

# prompt
_prompt_standard: &prompt_standard
  prompt_config:
    topdown: false
    cogmap: false
    type: standard

_prompt_topdown: &prompt_topdown
  prompt_config:
    topdown: true
    cogmap: false
    type: standard

# exp_type

# _passive: &passive
#   exp_type: passive
#   n_objects: 10
#   proportional_to_area: true
#   level: 2 # 0, 1, 2
#   main: 5 # 12, 7, 5
#   #   fix_room_size: [[8, 8], [6, 6], [4, 4]]
#   #   fix_object_n: [4, 3, 1]
#   room_size: [20, 20]
#   same_room_size: true
#   proxy_agent_config:
#     type: analyst
#     delegate: observer_analyst
#     observer_delegate: strategist

_passive: &passive
  exp_type: passive
  n_objects: 10
  proportional_to_area: true
  level: 2
  main: 5
  room_size: [20, 20]
  room_sizes: [7, 6, 5]  # Square rooms: 7x7, 6x6, 5x5
  # align_with_vision: true     
  # vision_data_path: "ragen/env/spatial/room_data/" 
  # same_room_size: true
  proxy_agent_config:
    type: analyst
    delegate: observer_analyst
    observer_delegate: strategist
# _active: &active
#   exp_type: active
#   n_objects: 8
#   max_exp_steps: 15
#   room_size: [20, 20]
#   level: 2
#   main: 6
#   same_room_size: true

_active: &active
  exp_type: active
  n_objects: 8
  proportional_to_area: true
  max_exp_steps: 15
  room_size: [15, 15]
  level: 1
  main: 6
  room_sizes: [6, 5]  # Square rooms: 6x6, 5x5
  calculate_information_gain: false
  align_with_vision: true   
  vision_data_path: "../../vagen/env/spatial/room_data/"
  
